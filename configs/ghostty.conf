# mac-setup Ghostty preset (Ghostty 1.4+ on macOS)
# Built-in Catppuccin themes follow the system appearance.
theme = light:Catppuccin Latte,dark:Catppuccin Mocha
font-family = MesloLGS Nerd Font Mono
font-size = 14
window-padding-x = 12
window-padding-y = 10
background-opacity = 0.80
background-blur = 20
window-save-state = always
scrollback-limit = 50000000
# Left Option supports shell word navigation; Right Option keeps macOS input.
macos-option-as-alt = left

# Keep Ghostty's standard Cmd+T, Cmd+W, Cmd+K and Cmd+Shift+, bindings.
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+alt+left=goto_split:left
keybind = super+alt+right=goto_split:right
keybind = super+alt+up=goto_split:up
keybind = super+alt+down=goto_split:down
keybind = super+shift+enter=toggle_split_zoom
# App-local shortcut; no Accessibility permission needed.
keybind = ctrl+grave_accent=toggle_quick_terminal
quick-terminal-position = top
quick-terminal-size = 40%
