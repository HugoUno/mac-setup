# Hugo 個人鼠鬚管設定；2026-10-29 從 ~/Library/Rime 同步。
# 設定內容與還原方式見同目錄 README.md。
---
patch:
  app_options:
    co.zeit.hyper:
      ascii_mode: true
    com.alfredapp.Alfred:
      ascii_mode: true
    com.apple.Spotlight:
      ascii_mode: true
    com.apple.Terminal:
      ascii_mode: true
      no_inline: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.barebones.textwrangler:
      ascii_mode: true
    com.blacktree.Quicksilver:
      ascii_mode: true
    com.github.atom:
      ascii_mode: true
    com.google.Chrome:
      inline: true
    com.macromates.TextMate.preview:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
    com.runningwithcrayons.Alfred-2:
      ascii_mode: true
    com.sublimetext.2:
      ascii_mode: true
    org.gnu.Aquamacs:
      ascii_mode: true
    org.gnu.Emacs:
      ascii_mode: true
      no_inline: true
    org.vim.MacVim:
      ascii_mode: true
      no_inline: true
      vim_mode: true
    ru.keepcoder.Telegram:
      inline: true
  chord_duration: 0.1
  keyboard_layout: last
  show_notifications_when: appropriate
  style:
    border_height: 0
    border_width: 0
    color_scheme: native
    comment_font_point: 18
    corner_radius: 10
    font_face: Lucida Grande
    font_point: 21
    hilited_corner_radius: 0
    inline_preedit: true
    label_font_point: 18
    line_spacing: 5
    spacing: 10
    text_orientation: horizontal
